name: Build Noshirvani 413 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت فایل‌ها
        uses: actions/checkout@v4

      - name: نصب Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: نصب Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: استخراج پروژه Android
        run: |
          mkdir android-project
          unzip -q *.zip -d android-project

      - name: ساخت APK
        working-directory: android-project
        run: |
          chmod +x gradlew
          gradle --no-daemon assembleDebug

      - name: ذخیره APK
        uses: actions/upload-artifact@v4
        with:
          name: Noshirvani413-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
